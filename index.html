<!doctype html><html lang=en><head><meta charset=UTF-8><meta name=viewport content="width=device-width,initial-scale=1"><meta http-equiv=Content-Security-Policy content="default-src 'self'; connect-src 'self' https://weather.visualcrossing.com; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-eval';"><title>Odin Weather</title><script defer src=main.js></script></head><body><div id=app><form id=weather-form><input id=location-input placeholder="Enter city name..." required> <button type=submit>Get Weather</button></form><div id=loading class=hidden>Fetching securely...</div><div id=weather-card class=hidden><h2 id=city-name></h2><p id=condition><div class=temperature-row><span id=temperature></span> <button id=unit-toggle class=toggle-btn aria-label="Toggle Temperature Unit">°C</button></div><div class=weather-details><p>Humidity: <span id=humidity></span>%<p>Wind: <span id=wind></span> km/h</div></div></div></body></html>
