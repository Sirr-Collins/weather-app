<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- CSP explicitly allows fetching data from Visual Crossing -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https://weather.visualcrossing.com; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-eval';">
    <title>Odin Weather</title>
</head>
<body>
    <div id="app">
        <form id="weather-form">
            <input type="text" id="location-input" placeholder="Enter city name..." required>
            <button type="submit">Get Weather</button>
        </form>

        <!-- Loading State -->
        <div id="loading" class="hidden">Fetching Data Securely...</div>

        <!-- Weather Display Card -->
        <div id="weather-card" class="hidden">
            <h2 id="city-name"></h2>
            <p id="condition"></p>
            
            <div class="temperature-row">
                <span id="temperature"></span>
                <button id="unit-toggle" class="toggle-btn" aria-label="Toggle Temperature Unit">°C</button>
            </div>
            
            <div class="weather-details">
                <p>Humidity: <span id="humidity"></span>%</p>
                <p>Wind: <span id="wind"></span> km/h</p>
            </div>
        </div>
    </div>
</body>
</html>
